name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Shared CSharp fixtures and portable backup
        env:
          CODEX_LEDGER_INTEROP_OUTPUT: ${{ runner.temp }}/windows-backup.json
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: dotnet run --project Windows/Ledger.Tests
      - name: Accounting tests and CSharp to Swift backup
        env:
          CODEX_LEDGER_INTEROP_INPUT: ${{ runner.temp }}/windows-backup.json
          CODEX_LEDGER_SWIFT_BACKUP_OUTPUT: ${{ runner.temp }}/swift-backup.json
        run: zsh test.sh
      - name: Swift to CSharp backup
        run: dotnet run --project Windows/Ledger.Tests --no-build -- --verify-backup "$RUNNER_TEMP/swift-backup.json"
      - name: Build native app
        env:
          CODEX_LEDGER_NATIVE_ICON: ${{ matrix.runner == 'macos-latest' && 'required' || 'auto' }}
        run: CODEX_LEDGER_ARCH="$(uname -m)" zsh build.sh
      - name: Verify and run diagnostic without personal data
        shell: zsh {0}
        run: |
          codesign --verify --deep --strict "dist/Codex Ledger.app"
          unzip -t dist/*.zip
          mkdir -p "$RUNNER_TEMP/ledger-empty/sessions"
          CODEX_LEDGER_SOURCE="$RUNNER_TEMP/ledger-empty" "dist/Codex Ledger.app/Contents/MacOS/CodexLedger" --diagnose --scope=all
