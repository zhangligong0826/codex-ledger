<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Codex Ledger ice blue glass bars">
  <!-- Editable design reference. MakeIcon.swift generates the shipping raster and ICNS. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0.85" y2="1">
      <stop stop-color="#ffffff"/><stop offset=".48" stop-color="#f3f8fc"/><stop offset="1" stop-color="#bdd1e1"/>
    </linearGradient>
    <linearGradient id="glass">
      <stop stop-color="#d2f0ff" stop-opacity=".85"/><stop offset=".3" stop-color="#f4fbff" stop-opacity=".94"/>
      <stop offset=".72" stop-color="#91c6ec" stop-opacity=".72"/><stop offset="1" stop-color="#609ad0" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="white" stop-opacity=".7"/><stop offset="1" stop-color="#a3d7f3" stop-opacity=".08"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#6588a4" flood-opacity=".23"/>
    </filter>
  </defs>
  <rect x="90" y="90" width="844" height="844" rx="192" fill="url(#plate)" stroke="white" stroke-width="4" filter="url(#shadow)"/>
  <path d="M130 335 Q512 95 900 320" fill="none" stroke="white" stroke-width="34" opacity=".18"/>
  <g filter="url(#shadow)" stroke="#e8f8ff" stroke-width="4">
    <rect x="252" y="548" width="140" height="240" rx="40" fill="url(#glass)"/>
    <rect x="442" y="398" width="140" height="390" rx="40" fill="url(#glass)"/>
    <rect x="632" y="248" width="140" height="540" rx="40" fill="url(#glass)"/>
  </g>
  <g fill="url(#face)">
    <rect x="252" y="548" width="140" height="240" rx="40"/>
    <rect x="442" y="398" width="140" height="390" rx="40"/>
    <rect x="632" y="248" width="140" height="540" rx="40"/>
  </g>
  <g fill="none" stroke="white" stroke-width="6" stroke-linecap="round" opacity=".76">
    <path d="M269 742 V589 Q269 566 290 566"/>
    <path d="M459 742 V439 Q459 416 480 416"/>
    <path d="M649 742 V289 Q649 266 670 266"/>
  </g>
</svg>
